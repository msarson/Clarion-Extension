name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being released (e.g., 0.8.8)'
        required: true
        type: string
      next_version:
        description: 'Next development version branch to create (e.g., 0.8.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # #781 — the tests run as the dry run runs them (testrelease.yml): on Windows, server and client
  # suites, failures counting. This job used to be a `npm run test:server || true` step on
  # ubuntu-latest, where the suite cannot pass (file resolution is case-insensitive, as the
  # compiler's is; #442): the 1.0.9 release showed 331 failing under a green step. The release job
  # below needs this one, so nothing is merged, tagged or published unless the suite passes, and
  # it releases the very commit tested here (outputs.sha), not whatever the branch holds by then.
  # Keep these steps in step with testrelease.yml's.
  test:
    runs-on: windows-latest

    # It only reads: npm ci and the suite run without the release's write token.
    permissions:
      contents: read

    outputs:
      sha: ${{ steps.tested.outputs.sha }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout version branch
        uses: actions/checkout@v5
        with:
          ref: version-${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match release input ($INPUT_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Build dev for the tests
        run: npm run compile:dev

      - name: Run server tests
        run: npm run test:server

      - name: Run client tests
        run: npm run test:client

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout version branch
        uses: actions/checkout@v5
        with:
          ref: version-${{ inputs.version }}
          fetch-depth: 0

      # #781 — the branch is checked out again here, minutes after the tests; a push in between
      # would release a commit they never ran on. Stop instead: dispatch the release again. A
      # version tag left by an earlier, partly failed attempt must name this commit too: the
      # release step updates an existing release, so a fix pushed under the same version would
      # ship a VSIX the tag does not describe. That needs a new version instead.
      - name: Verify this is the commit the tests passed on
        env:
          TESTED: ${{ needs.test.outputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$TESTED" ] || [ "$HEAD_SHA" != "$TESTED" ]; then
            echo "❌ version-$INPUT_VERSION is at $HEAD_SHA, but the tests passed on '$TESTED'. Dispatch the release again."
            exit 1
          fi
          TAG_SHA=$(git ls-remote origin "refs/tags/v$INPUT_VERSION" "refs/tags/v$INPUT_VERSION^{}" | tail -n 1 | cut -f1)
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$TESTED" ]; then
            echo "❌ Tag v$INPUT_VERSION already names $TAG_SHA, not the tested $TESTED. Release the change as a new version."
            exit 1
          fi
          echo "✅ Releasing the tested commit $HEAD_SHA"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches input
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match release input (${{ inputs.version }})"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      # The tests ran in the test job; `vsce package` builds the bundle itself (vscode:prepublish).
      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: vsce package

      - name: Merge version branch into master
        run: |
          git checkout master
          git merge version-${{ inputs.version }} --no-ff -m "Release v${{ inputs.version }}: merge version-${{ inputs.version }} into master"
          git push origin master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          # #781 — the tag goes on the tested commit; the default is the run's github.sha, the
          # branch head when the release was dispatched.
          target_commitish: ${{ needs.test.outputs.sha }}
          name: Release v${{ inputs.version }}
          draft: false
          prerelease: false
          files: ./clarion-extensions-${{ inputs.version }}.vsix
          generate_release_notes: true
          body: |
            ## Installation

            Download the VSIX file below and install it in VS Code:
            1. Open VS Code
            2. Go to Extensions (Ctrl+Shift+X)
            3. Click "..." menu → "Install from VSIX..."
            4. Select the downloaded file

            ## Marketplace

            This version is also available on the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=msarson.clarion-extensions).

            ## What's New

            See [CHANGELOG.md](https://github.com/msarson/Clarion-Extension/blob/master/CHANGELOG.md) for full details.

      # #781 — the VSIX packaged from the tested commit, the one the GitHub release carries. Plain
      # `vsce publish` packages the working tree again, and by now that is master after the merge.
      - name: Publish to VS Code Marketplace
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: vsce publish --packagePath "./clarion-extensions-$INPUT_VERSION.vsix" --pat ${{ secrets.VSCE_PAT }}

      - name: Create next version branch
        env:
          HUSKY: 0
        run: |
          git checkout master
          # Dependabot reads .github/dependabot.yml from master, so master must carry the
          # NEW active version branch as target-branch (see the comment in that file).
          # Release machinery: the only non-release-merge commit master ever receives.
          sed -i 's/^\([[:space:]]*target-branch:[[:space:]]*\).*/\1"version-${{ inputs.next_version }}"/' .github/dependabot.yml
          git add .github/dependabot.yml
          git commit -m "chore(dependabot): target version-${{ inputs.next_version }}"
          git push origin master
          git checkout -b version-${{ inputs.next_version }}
          npm version ${{ inputs.next_version }} --no-git-tag-version
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const stub = '### [${{ inputs.next_version }}] - Unreleased\n\n---\n\n';
            const updated = content.replace('## Recent Versions\n\n', '## Recent Versions\n\n' + stub);
            fs.writeFileSync('CHANGELOG.md', updated);
          "
          # The settings and commands references carry the version they document, and a test
          # (#699) holds them to package.json's - bump them with it, or the new branch, and
          # every PR against it, starts red (1.0.7 did, #714).
          sed -i 's/\(generated from the extension manifest for \*\*v\)[0-9][0-9.]*\(\*\*\)/\1${{ inputs.next_version }}\2/' docs/reference/settings.md docs/reference/commands.md
          git add package.json package-lock.json CHANGELOG.md docs/reference/settings.md docs/reference/commands.md
          git commit -m "chore: Bump version to ${{ inputs.next_version }} and add changelog stub"
          git push origin version-${{ inputs.next_version }}

      - name: Point the default branch at the next version branch
        # CONTRIBUTING tells contributors to target the current development branch,
        # and GitHub pre-selects the repository default as a PR's base. When the
        # default is left on master, every external PR arrives mis-based: #439 came
        # in as 70 files / +4930 for what was actually a 3-file / +129 change,
        # because the diff picked up everything already merged into the version
        # branch. The contributor had done nothing wrong.
        #
        # Must run BEFORE the delete below: GitHub will not remove a branch that is
        # currently the default.
        #
        # GITHUB_TOKEN CANNOT do this. Changing the default branch is a repository
        # settings write, and `administration` is a fine-grained-PAT permission, not
        # one of the `permissions:` keys a workflow token accepts — declaring it
        # makes the whole workflow file invalid. So this step uses an OPTIONAL PAT
        # secret and degrades to a reminder when it is absent, which is the state
        # today (only VSCE_PAT is configured).
        #
        # To automate it: create a PAT with repo-admin rights and add it as
        # REPO_ADMIN_TOKEN. Until then the release still completes and the log
        # carries the one-line manual fix.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          NEXT="version-${{ inputs.next_version }}"
          MANUAL="gh repo edit ${GITHUB_REPOSITORY} --default-branch $NEXT"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::No REPO_ADMIN_TOKEN secret — cannot set the default branch automatically."
            echo "::warning::Run this now: $MANUAL"
            echo "::warning::Until it is set, external PRs arrive based on master and need retargeting (see #439)."
            exit 0
          fi
          if gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f default_branch="$NEXT" --silent; then
            echo "✅ Default branch set to $NEXT — new PRs will now target it by default."
          else
            echo "::warning::REPO_ADMIN_TOKEN did not have rights to set the default branch."
            echo "::warning::Run this by hand: $MANUAL"
          fi

      - name: Delete released version branch
        # Runs only if every prior step succeeded (merge, release, publish, next-branch).
        # History is preserved in master and the v${{ inputs.version }} tag, so the branch is safe to remove.
        #
        # #591: GitHub refuses to delete the repository's DEFAULT branch, and the step
        # above can only move the default when REPO_ADMIN_TOKEN exists. Without that
        # secret this delete could not succeed — so every release ended on
        #
        #     ! [remote rejected] version-X.Y.Z (refusing to delete the current branch)
        #
        # marking a run that had already merged, tagged, released and published to the
        # Marketplace as FAILED. A red run for something that is not a failure is worse
        # than the untidiness it was reporting, and it trains you to ignore a red release.
        #
        # So ask first. If the default has moved, delete and say so. If it has not, name
        # the two commands that finish the job and leave the run green. A delete that
        # fails for any OTHER reason still fails the step — which is precisely what a
        # blanket `continue-on-error: true` here would have thrown away.
        #
        # Adding REPO_ADMIN_TOKEN makes this fully automatic; nothing here changes then,
        # the first branch simply stops being taken.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASED="version-${{ inputs.version }}"
          NEXT="version-${{ inputs.next_version }}"
          DEFAULT="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"

          if [ "$DEFAULT" = "$RELEASED" ]; then
            echo "::warning::$RELEASED is still the repository default branch, so GitHub will not delete it."
            echo "::warning::That is the missing REPO_ADMIN_TOKEN secret — see the previous step and #591."
            echo "::warning::The release itself is COMPLETE. Finish the tidy-up by hand, in this order:"
            echo "::warning::  gh repo edit ${GITHUB_REPOSITORY} --default-branch $NEXT"
            echo "::warning::  git push origin --delete $RELEASED"
            exit 0
          fi

          git push origin --delete "$RELEASED"
          echo "✅ Deleted $RELEASED — history is in master and the v${{ inputs.version }} tag."
