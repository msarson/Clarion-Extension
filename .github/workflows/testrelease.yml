name: Test Release (Dry Run)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g., 0.9.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-release:
    # #441/#442 — Windows, because that is the only platform this extension
    # supports and the only one its suite passes on. On ubuntu-latest 172 tests
    # fail: file resolution relies on the filesystem being case-insensitive
    # exactly as the Clarion compiler does, so those failures are correct
    # behaviour rather than a defect (see #442). Running here is what lets the
    # test step below assert anything at all.
    runs-on: windows-latest

    defaults:
      run:
        # Keeps the existing POSIX steps working unchanged; Windows runners ship
        # Git Bash. The one step that cannot survive the move is the VSIX report,
        # which needed `unzip` — absent from Git for Windows — and is rewritten
        # in PowerShell below.
        shell: bash

    steps:
      - name: Preflight — can the release move the default branch? (#591)
        # The release workflow must point the repository default at the NEXT version
        # branch before it can delete the one just released, because GitHub refuses to
        # delete the current default. That needs REPO_ADMIN_TOKEN, an optional secret.
        # When it is missing the release still completes and leaves two manual commands
        # in its log — it no longer fails for it (#591).
        #
        # Checking it HERE is the whole point: a dry run is dispatched before every real
        # release, this is the environment the secret is actually read in (which a local
        # check cannot prove), and an expired token is found BEFORE a release instead of
        # during one.
        #
        # The write is idempotent by construction: it PATCHes the default branch to
        # whatever it already is, read back in this same step. Running this cannot change
        # the default, whatever `version` was dispatched — which matters, because naming
        # a branch here instead would silently RE-POINT the default on any dry run of an
        # older version.
        #
        # Never fails the run. It reports; the build below is what this workflow is for.
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::REPO_ADMIN_TOKEN is not configured."
            echo "::warning::The release will complete, then leave two manual commands in its log (#591)."
            exit 0
          fi

          CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch 2>/dev/null)" || CURRENT=""
          if [ -z "$CURRENT" ]; then
            echo "::warning::REPO_ADMIN_TOKEN is set but cannot read ${GITHUB_REPOSITORY}."
            echo "::warning::Check the token is scoped to this repository and has not expired."
            exit 0
          fi

          if gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f default_branch="$CURRENT" --silent; then
            echo "REPO_ADMIN_TOKEN OK — it can set the default branch (no-op, left on $CURRENT)."
            echo "The release will be fully automatic: default moved, released branch deleted."
          else
            echo "::warning::REPO_ADMIN_TOKEN is set but cannot set the default branch."
            echo "::warning::It needs the 'Administration: read and write' repository permission."
            echo "::warning::The release will complete and leave the two manual commands in its log (#591)."
          fi

      - name: Checkout version branch
        uses: actions/checkout@v5
        with:
          ref: version-${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches input
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match input (${{ inputs.version }})"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Build dev and run tests
        run: npm run compile:dev

      # #441 — this used to be `npm run test:server || true`, which discarded the
      # exit code: the workflow reported success whether the suite passed, failed
      # one test, or failed 172. A green dry run therefore said nothing about the
      # tests, which is worse than not running them, because it invited the belief
      # that they had been verified. The `|| true` existed only because the suite
      # could not pass on Linux; on Windows it does, so the result can be trusted.
      - name: Run server tests
        run: npm run test:server

      # Also new: the client suite was never run here at all, so ~197 tests took no
      # part in the release gate.
      - name: Run client tests
        run: npm run test:client

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension (bundle + VSIX)
        run: vsce package --no-dependencies

      # Rewritten for the Windows move: the previous version used `unzip`, which
      # Git for Windows does not ship. .NET's ZipFile is present on the runner and
      # needs no tooling at all.
      #
      # The file count is the check that matters. A correctly bundled VSIX is ~26
      # files; a build where the esbuild bundle did not replace the tsc output ships
      # hundreds, and that has happened before. Worth reading on every dry run.
      - name: Report VSIX stats
        shell: pwsh
        run: |
          $vsix = "clarion-extensions-${{ inputs.version }}.vsix"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsix))
          try {
            $count = $zip.Entries.Count
            $sizeMb = [math]::Round((Get-Item $vsix).Length / 1MB, 2)
            Write-Host "VSIX:  $vsix"
            Write-Host "Size:  $sizeMb MB"
            Write-Host "Files: $count"
            if ($count -gt 100) {
              Write-Host "::warning::$count files in the VSIX - a correctly bundled one is ~26. The esbuild bundle may not have replaced the tsc output."
            }
            Write-Host ""
            Write-Host "=== Contents ==="
            $zip.Entries | Sort-Object FullName | ForEach-Object {
              "{0,10}  {1}" -f $_.Length, $_.FullName
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload VSIX as artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: clarion-extensions-${{ inputs.version }}-test
          path: clarion-extensions-${{ inputs.version }}.vsix
          retention-days: 7
