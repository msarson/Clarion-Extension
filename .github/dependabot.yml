# Dependabot configuration.
#
# Dependabot reads this from the DEFAULT branch (master). It is also carried on
# the active version-x.y.z branch so a release merge doesn't revert it.
#
# target-branch: master only ever receives the release merge of a version branch,
# so Dependabot's PRs must go to the ACTIVE version-x.y.z branch. The release
# workflow rewrites this value on master when it creates the next version branch
# (the one non-release commit master receives, as release machinery). Note:
# GitHub raises automatic SECURITY-update PRs only against the default branch, so
# with target-branch set those stop — security ALERTS still fire and are handled
# by hand on the version branch (same as #419's group, which needed a hand-fix
# anyway).
#
# Posture (tiered — see #390 / #405 for the why):
#   - Security updates: always on (repo setting; fire regardless of schedule).
#   - Routine minor/patch: grouped into one PR per directory, monthly — low-risk,
#     keeps drift down without a firehose.
#   - Majors: never auto-proposed. Breaking upgrades (e.g. vscode-languageclient
#     8->10, #405) are deliberate, tested migrations done in their own PR.
#   - The ANTLR grammar experiment was split out to the archived repo
#     https://github.com/msarson/Clarion-ANTLR-Grammar (tag antlr-experiment marks
#     the last commit here that carried antlr-grammar/), so no manifest for it
#     lives in this tree any more.
version: 2
updates:
  - package-ecosystem: "npm"
    target-branch: "version-1.0.2"
    directories:
      - "/"
      - "/client"
      - "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors are deliberate, tested migrations — never an auto-PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned to 3.17.x: 3.18+ is exports-only and needs tsconfig
      # moduleResolution node16/bundler — deferred to the LSP migration (#405).
      - dependency-name: "vscode-languageserver-protocol"
      # Must track engines.vscode (the declared minimum VS Code) — bumping it
      # ahead of engines fails `vsce package`. Move it only when raising engines.
      - dependency-name: "@types/vscode"
